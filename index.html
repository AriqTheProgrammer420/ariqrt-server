<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Walkie&nbsp;Talkie</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #f0f0f0;
      }
      h2 {
        margin-top: 0;
        font-size: 2rem;
      }
      input,
      button {
        margin: 10px;
        padding: 1rem;
        font-size: 1.2rem;
        border-radius: 8px;
        border: none;
      }
      button {
        background: #007bff;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        background: #999;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h2>Walkie&nbsp;Talkie 🔊</h2>
    <input
      id="room"
      placeholder="Room ID"
      style="padding: 10px; margin-bottom: 10px;"
    />
    <button id="joinBtn">Join Room</button>
    <button id="startBtn" disabled>Start Talking</button>
    <button id="stopBtn" disabled>Stop Talking</button>

    <!-- Socket.IO will be served automatically by the server from /socket.io/socket.io.js -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
      // Connect to the signalling server
      const socket = io();

      // Elements
      const joinBtn = document.getElementById('joinBtn');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const roomInput = document.getElementById('room');

      // State
      let roomId;
      let peerConnection;
      let localStream;
      let remoteStream;

      // STUN server configuration for WebRTC
      const config = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
        ],
      };

      // Join a room for signalling
      joinBtn.onclick = () => {
        roomId = roomInput.value.trim();
        if (!roomId) return;
        socket.emit('join-room', roomId);
        joinBtn.disabled = true;
        roomInput.disabled = true;
        startBtn.disabled = false;
      };

      // Start talking: capture microphone and create an offer
      startBtn.onclick = async () => {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (err) {
          console.error('Error accessing microphone:', err);
          return;
        }
        peerConnection = new RTCPeerConnection(config);
        localStream.getTracks().forEach((track) =>
          peerConnection.addTrack(track, localStream)
        );

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            socket.emit('ice-candidate', event.candidate, roomId);
          }
        };

        peerConnection.ontrack = (event) => {
          // Play incoming audio
          if (!remoteStream) {
            remoteStream = new MediaStream();
            const audio = new Audio();
            audio.srcObject = remoteStream;
            audio.play();
          }
          remoteStream.addTrack(event.track);
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('offer', offer, roomId);
        startBtn.disabled = true;
        stopBtn.disabled = false;
      };

      // Stop talking: close tracks and connection
      stopBtn.onclick = () => {
        if (localStream) {
          localStream.getTracks().forEach((track) => track.stop());
          localStream = null;
        }
        if (peerConnection) {
          peerConnection.close();
          peerConnection = null;
        }
        startBtn.disabled = false;
        stopBtn.disabled = true;
      };

      // Signalling handlers
      socket.on('offer', async (offer, fromId) => {
        peerConnection = new RTCPeerConnection(config);
        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            socket.emit('ice-candidate', event.candidate, fromId);
          }
        };
        peerConnection.ontrack = (event) => {
          if (!remoteStream) {
            remoteStream = new MediaStream();
            const audio = new Audio();
            audio.srcObject = remoteStream;
            audio.play();
          }
          remoteStream.addTrack(event.track);
        };
        // Get our own microphone so we can answer
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (err) {
          console.error('Error accessing microphone:', err);
          return;
        }
        localStream.getTracks().forEach((track) =>
          peerConnection.addTrack(track, localStream)
        );
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('answer', answer, fromId);
      });

      socket.on('answer', (answer) => {
        if (peerConnection) {
          peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        }
      });

      socket.on('ice-candidate', (candidate) => {
        if (peerConnection) {
          peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        }
      });
    </script>
  </body>
</html>
