<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARiQRT Walkie Talkie</title>
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #000;
        color: #fff;
      }
      h2 { margin-bottom: 20px; }
      input, button {
        margin: 8px;
        padding: 0.8rem 1rem;
        font-size: 1.1rem;
        border-radius: 8px;
        border: none;
        outline: none;
      }
      input {
        width: 200px;
        background: #111;
        color: #fff;
        border: 1px solid #444;
      }
      button {
        background: #fff;
        color: #000;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #ccc;
      }
    </style>
  </head>
  <body>
    <h2>ARiQRT 🔊</h2>
    <input id="room" placeholder="Room ID"/>
    <button id="joinBtn">Join Room</button>
    <button id="startBtn">Start Talking</button>
    <button id="stopBtn">Stop Talking</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      let peerConnection;
      let localStream;
      let peerId;
      let roomId;

      const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

      const joinBtn = document.getElementById("joinBtn");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");

      joinBtn.onclick = () => {
        roomId = document.getElementById("room").value;
        socket.emit("join-room", roomId);
      };

      startBtn.onclick = async () => {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        peerConnection = new RTCPeerConnection(config);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.onicecandidate = e => {
          if (e.candidate && peerId) {
            socket.emit("ice-candidate", e.candidate, peerId);
          }
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit("offer", offer, roomId);
      };

      stopBtn.onclick = () => {
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        if (peerConnection) peerConnection.close();
      };

      socket.on("offer", async (offer, fromId) => {
        peerId = fromId;
        peerConnection = new RTCPeerConnection(config);
        peerConnection.ontrack = e => {
          const remoteAudio = new Audio();
          remoteAudio.autoplay = true;
          remoteAudio.srcObject = e.streams[0];
          document.body.appendChild(remoteAudio);
        };
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit("answer", answer, fromId);
      });

      socket.on("answer", (answer, fromId) => {
        peerId = fromId;
        peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
      });

      socket.on("ice-candidate", (candidate, fromId) => {
        if (peerConnection) peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
      });
    </script>
  </body>
</html>
